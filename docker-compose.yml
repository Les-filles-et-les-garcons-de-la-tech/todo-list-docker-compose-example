services:
  mongo:
    image: mongo:8.2
    container_name: webapp-mongo
    restart: always
    environment:
      # Utilisateur root de Mongo
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: example
      # Base créée par défaut (même nom que dans appsettings.json: "webapp")
      MONGO_INITDB_DATABASE: webapp
    ports:
      - "27017:27017"
    volumes:
      - db-volume:/data/db
  
  mongo-express:
    image: mongo-express:1.0.2
    container_name: webapp-mongo-express
    restart: always
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: example
      ME_CONFIG_MONGODB_URL: mongodb://admin:example@mongo:27017/
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongo      

  api:
    image: backend-todolist:1.0
    container_name: webapp-go
    ports:
      - "8082:82"
    environment:
      # Variables de connexion mongo si changées.
      DB_ADDRESS: mongo
      DB_PORT: 27017
      DB_USERNAME: admin
      DB_PASSWORD: example

      BACKGROUND_COLOR: #4287f5
    depends_on:
      - mongo

  front:
    image: frontend-todolist:1.0
    container_name: webapp-angular
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  db-volume:
